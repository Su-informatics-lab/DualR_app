# --- HTTP redirect ---
server {
    listen 3000;
    server_name dualr.hainingwang.org;
    return 301 https://$host$request_uri;
}

# --- HTTPS ---
server {
    listen 3443 ssl http2;
    server_name dualr.hainingwang.org;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend container (Compose service name: backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: route all paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed JS/CSS bundles, so browsers must revalidate it on
    # every visit or they keep running the previous release after a deploy.
    # add_header here replaces the server-level headers, so they are repeated.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # pdf.js ships its worker as .mjs, which nginx's mime.types does not map; browsers
    # refuse module scripts that are not served as JavaScript.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
